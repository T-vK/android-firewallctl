name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The Makefile compiles with javac 1.8 source/target but R8 (the dex
      # backend used when d8/dx aren't present) needs Java 11+. Setting up
      # Java 21 covers both: javac downgrades source/target as requested.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              make dpkg-dev zip unzip shellcheck

      - name: Build dex jar
        run: make

      - name: Build Termux .deb
        run: make deb

      - name: Build Magisk module zip
        run: make magisk

      - name: Run tests
        run: make test

      - name: Upload firewallctl dex jar
        uses: actions/upload-artifact@v4
        with:
          name: firewallctl-dex
          path: build/firewallctl.dex.jar
          if-no-files-found: error

      - name: Upload Termux .deb
        uses: actions/upload-artifact@v4
        with:
          name: firewallctl-deb
          path: build/firewallctl_*_all.deb
          if-no-files-found: error

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: firewall-default-deny-magisk
          path: build/firewall_default_deny_*.zip
          if-no-files-found: error

  # semantic-release computes the next version from the Conventional Commits
  # since the last tag (feat: -> minor, fix:/perf: -> patch, BREAKING CHANGE
  # -> major), builds version-stamped artifacts via `make dist`, then tags
  # the commit and publishes a GitHub Release with those artifacts attached.
  release:
    name: release
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the git tag + GitHub Release
      issues: write         # comment on resolved issues
      pull-requests: write  # comment on merged PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # semantic-release needs full history + tags

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              make dpkg-dev zip unzip

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release@24 \
            -p @semantic-release/exec@6 \
            semantic-release
